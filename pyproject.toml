[build-system]
requires = ["setuptools==84.0.0"]   # pinned build backend
build-backend = "setuptools.build_meta"

[project]
name = "qqinstall"
version = "0.1.0"
description = "quirq infra (qq) installer: resolve a release channel to a commit and digest."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1", "pyyaml==6.0.3"]   # pyyaml: tools/check_pins.py
# The producer of channels.json, by pinned commit (never copied); see pins.toml.
contract = ["qqrelease @ git+https://github.com/quirq-ai/release@15b9ebbc77520881b4ab8ff8faf98750061c1d46"]

[project.scripts]
qqinstall = "qqinstall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
