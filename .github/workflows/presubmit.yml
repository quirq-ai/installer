# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result; also on pushes to
# main, so main's own state is recorded.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: read the infra-config pin
        id: pin
        run: python -c "import tomllib; print('commit=' + tomllib.load(open('pins.toml', 'rb'))['infra-config']['commit'])" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: quirq-ai/infra-config
          ref: ${{ steps.pin.outputs.commit }}
          path: .qq/infra-config
          persist-credentials: false
      # PyPI packages by hash; other qq repos by the commits in pins.toml, without dependencies.
      - name: install
        run: |
          python -m pip install --quiet --require-hashes --no-deps -r requirements-ci.txt
          python -m pip install --quiet --no-deps --no-build-isolation -e .
          pin() { python -c "import sys, tomllib; print(tomllib.load(open('pins.toml', 'rb'))[sys.argv[1]]['commit'])" "$1"; }
          python -m pip install --quiet --no-deps --no-build-isolation \
            "qqrelease @ git+https://github.com/quirq-ai/release@$(pin release)" \
            "qqgarden @ git+https://github.com/quirq-ai/gardener@$(pin gardener)"
          python -m pip check
      - name: every action is pinned by commit SHA
        run: python tools/check_pins.py
      - run: python -m pytest -q -p no:cacheprovider
      - name: a script resolves canary to a commit and digest (V0-INS-01 done-when)
        run: python tools/contract_check.py --config .qq/infra-config
      - name: a test install follows canary, checked before it runs (V0-INS-02 done-when, offline half)
        run: python tools/canary_install_drill.py --config .qq/infra-config
